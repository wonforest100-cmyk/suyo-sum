<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청소년국 결과보고서 제작실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script async id="sbjs" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   0. 공통 변수
   ============================================================ */
:root{
  --theme:#5fb336; --ink:#1f2328; --muted:#6b7280; --line:#e3e6ea; --bg:#f3f5f7; --panel:#fff;
  --accent:#2f7d1f; --danger:#d64545; --warn:#e8930c;
  --docfont:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  /* 인쇄 문서 변수 (설정에서 바뀜) */
  --mt:22mm; --mb:20mm; --ml:20mm; --mr:20mm; --gutter:0mm; --fs:10.5pt; --lh:1.65; --kvw:5em;
  --sp:1; --imgs:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--docfont);color:var(--ink);background:var(--bg);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ============================================================
   1. 앱 레이아웃
   ============================================================ */
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
#top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);min-width:0}
#top .brand{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
#top .brand i{width:22px;height:22px;border-radius:50%;border:3px solid var(--theme);display:inline-block}
#top .doc-title{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;margin-left:8px}
.tabs button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#top .sp{flex:1}
.tb{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.tb:hover{background:#f7f8f9}
.tb.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.pri:hover{filter:brightness(1.07)}
.tb.sm{padding:3px 8px;font-size:12px}
.tb.danger{color:var(--danger)}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.err{color:var(--danger);font-weight:700}
#userChip{font-size:12px;padding:5px 10px;border-radius:20px;background:var(--bg);white-space:nowrap}

#main{display:grid;grid-template-columns:270px 1fr;min-height:0}
#main.with-side{grid-template-columns:270px 1fr 400px}
#tree{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 8px 40px}
#center{overflow:auto;min-width:0;position:relative}
#side{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* 트리 */
.tg{margin-bottom:10px}
.tg-h{display:flex;align-items:center;gap:6px;padding:6px 8px;font-weight:800;font-size:12.5px;color:#374151;border-radius:6px}
.tg-h .dot{width:10px;height:10px;border-radius:3px;flex:none}
.tg-h .cnt{color:var(--muted);font-weight:500}
.tg-h .add{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:0 4px;border-radius:4px}
.tg-h .add:hover{background:var(--bg);color:var(--ink)}
.tg-h.drop{outline:2px dashed var(--theme)}
.ti{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border-radius:7px;cursor:pointer;font-size:13px;position:relative}
.ti:hover{background:#f5f7f8}
.ti.on{background:color-mix(in srgb,var(--theme) 14%,#fff);font-weight:700}
.ti .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti.drop-before{box-shadow:inset 0 2px 0 var(--theme)}
.ti .lock{font-size:11px}
.chip{font-size:10.5px;padding:1px 6px;border-radius:10px;white-space:nowrap;font-weight:600;background:#eef0f2;color:#555}
.st-미작성{background:#eef0f2;color:#6b7280}
.st-작성중,.st-작성\ 중{background:#e3efff;color:#1d5fbf}
.st-검토요청{background:#fff1dc;color:#b35f00}
.st-수정요청{background:#fde4e4;color:#b42323}
.st-확정{background:#dff3d6;color:#2f7d1f}
.pres{display:flex;gap:2px}
.pres span{width:18px;height:18px;border-radius:50%;font-size:10px;color:#fff;display:grid;place-items:center;font-weight:700}

/* 편집기 */
#editorWrap{max-width:900px;margin:0 auto;padding:22px 26px 160px}
.meta{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.meta>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px}
.meta>summary::-webkit-details-marker{display:none}
.meta .ttl{font-size:19px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .body{padding:4px 16px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fld.w2{grid-column:span 2}.fld.w4{grid-column:span 4}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13.5px;color:var(--ink);background:#fff;font-weight:400;width:100%}
.fld textarea{resize:vertical;min-height:58px}
.fld input[type=checkbox],.fld input[type=radio]{width:auto;vertical-align:-2px;margin-right:4px}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:#f6f7f8}
.meta .acts{grid-column:span 4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.lock{background:#fff4e0;border:1px solid #f3d29b}
.banner.ro{background:#eef2f6;border:1px solid #d9dfe6}
.banner.info{background:#eaf6e4;border:1px solid #cfe8c2}

.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px 30px 18px;font-size:15px;line-height:1.7}
.eb{display:grid;grid-template-columns:62px 1fr 0;position:relative;border-radius:6px}
.eb:hover{background:#fafbfb}
.eb.focus{background:color-mix(in srgb,var(--theme) 6%,#fff)}
.eb.flag{box-shadow:inset 3px 0 0 var(--warn)}
.eb-gut{display:flex;justify-content:flex-end;align-items:flex-start;padding-right:8px;padding-top:2px}
.eb-type{border:0;background:transparent;color:#9aa1a9;font-size:11.5px;font-weight:700;padding:2px 5px;border-radius:5px;white-space:nowrap;min-width:26px}
.eb-type:hover{background:var(--bg);color:var(--ink)}
.eb-tools{position:absolute;right:-6px;top:0;transform:translateX(100%);display:none;flex-direction:column;gap:1px;padding-left:4px}
.eb:hover .eb-tools,.eb.focus .eb-tools{display:flex}
.eb-tools button{border:1px solid var(--line);background:#fff;width:24px;height:22px;font-size:12px;border-radius:5px;padding:0;color:#555}
.eb-tools button:hover{background:var(--bg)}
.ed{outline:none;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-height:1.6em;padding:1px 2px}
.ed:empty::before{content:attr(data-ph);color:#b8bec5}
.ro .ed,.ro .te td{cursor:default}
.eb-h1 .ed{font-size:21px;font-weight:800;border-bottom:2px solid var(--theme);padding-bottom:3px;margin-top:18px}
.eb-h1 .eb-type{margin-top:22px;color:var(--accent);font-size:14px}
.eb-h2 .ed{font-size:17.5px;font-weight:700;margin-top:10px}
.eb-h2 .eb-type{margin-top:12px;color:#444;font-size:13px}
.eb-sq .ed{font-weight:700;margin-top:6px}
.eb-sq .eb-type{margin-top:6px}
.eb-ci .eb-body{padding-left:22px}
.eb-da .eb-body{padding-left:44px}
.eb-nt .eb-body{padding-left:44px;font-size:14px;color:#444}
.eb-p .ed{text-align:justify}
.eb-box .eb-body{border-left:4px solid var(--theme);background:color-mix(in srgb,var(--theme) 7%,#fff);padding:8px 12px;border-radius:6px;margin:6px 0}
.eb-kv .eb-body{display:grid;grid-template-columns:7.5em 14px 1fr;padding-left:22px;align-items:start}
.eb-kv .k{font-weight:600;color:#333}
.eb-kv .c{color:#888}
.eb-br .eb-body{border-top:2px dashed #c8ced4;margin:14px 0;text-align:center;font-size:11px;color:#9aa1a9;line-height:0}
.eb-br .eb-body span{background:#fff;padding:0 8px}
.addline{display:flex;gap:6px;margin:16px 0 0 62px}
.blk-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.blk-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.blk-bar input[type=text]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;min-width:220px;flex:1}
.blk-bar select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
.blk-bar label{display:flex;gap:4px;align-items:center}
.blk-bar .lbl{font-weight:700;color:#444;margin-right:4px}
.te{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
.te td{border:1px solid #cfd5db;padding:4px 6px;min-width:44px;outline:none;vertical-align:top;white-space:pre-wrap;word-break:keep-all}
.te tr.th td{background:color-mix(in srgb,var(--theme) 14%,#fff);font-weight:700;text-align:center}
.te td:focus{box-shadow:inset 0 0 0 2px var(--theme)}
.te td.mg{color:#b0b6bd;text-align:center;background:#fafafa}
.te-wrap{overflow:auto}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.bt{width:100%;border-collapse:collapse;font-size:13px}
.bt th{background:#f3f5f7;font-size:12px;padding:5px;border:1px solid var(--line)}
.bt td{border:1px solid var(--line);padding:2px}
.bt input,.bt select{border:0;width:100%;padding:4px 5px;font-size:13px;background:transparent}
.bt input.n{text-align:right;font-variant-numeric:tabular-nums}
.bt td.calc{text-align:right;padding:4px 6px;color:#555;font-variant-numeric:tabular-nums;background:#fafbfb}
.bt tr.sum td{background:#f3f5f7;font-weight:700;text-align:right;padding:5px 6px}
.bt .x{border:0;background:transparent;color:#aaa}
.ig{display:grid;gap:8px}
.ig figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfb;position:relative}
.ig img{width:100%;display:block;aspect-ratio:4/3;object-fit:contain;background:#eef0f2}
.ig input{width:100%;border:0;border-top:1px solid var(--line);padding:5px 7px;font-size:12.5px}
.ig .ia{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.ig .ia button{border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;font-size:11px;padding:2px 6px}
.ig .up{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed #cfd5db;border-radius:8px;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fff}
.ig .up:hover{border-color:var(--theme);color:var(--accent)}
.chart-ed{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.chart-ed textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:13px;font-family:inherit}
.chart-ed .pv{border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff}

/* 팝오버 / 모달 */
.pop{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:200px;max-height:70vh;overflow:auto}
.pop .gh{font-size:11px;color:var(--muted);font-weight:700;padding:6px 8px 3px}
.pop button.it{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:6px 9px;border-radius:6px;font-size:13px;gap:8px}
.pop button.it:hover,.pop button.it.sel{background:var(--bg)}
.pop button.it kbd{margin-left:auto;color:var(--muted);font-family:inherit;font-size:11px}
.pop button.it .ic{width:20px;text-align:center;color:#666}
#modalBg{position:fixed;inset:0;background:rgba(15,20,25,.38);z-index:60;display:grid;place-items:center}
.modal{background:#fff;border-radius:14px;width:min(640px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center}
.modal h3 button{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--muted)}
.modal .mb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res{border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto}
.res .r{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.res .r:hover{background:#f7f8f9}
.res .r small{color:var(--muted);display:block;font-size:11.5px}
.res mark{background:#fff0a8}
.res .r.lv-warn{border-left:3px solid var(--warn)}
.res .r.lv-err{border-left:3px solid var(--danger)}
.res .r.lv-info{border-left:3px solid #9fb3c8}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#222;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* 우측 패널 */
.side-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.side-tabs button{border:0;background:transparent;padding:11px 10px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.side-tabs button.on{color:var(--ink);border-color:var(--theme)}
.side-body{flex:1;overflow:auto;padding:12px}
.pv-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.pv-bar b{color:var(--ink)}
.pv-pages{display:flex;flex-direction:column;gap:12px;align-items:center}
.pwrap{position:relative;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff;flex:none}
.pwrap .pno{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.pwrap .page{position:absolute;left:0;top:0}
.cmt{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.cmt.done{opacity:.55}
.cmt .h{display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.cmt .h b{color:var(--ink)}
.cmt .h .sp{flex:1}
.cmt a{color:var(--accent);cursor:pointer;font-size:11.5px}
textarea.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:64px;font-size:13px;resize:vertical}
input.in{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}

/* 전체 미리보기 */
#viewerBar{position:sticky;top:0;z-index:5;background:rgba(243,245,247,.95);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#viewerBar select,#viewerBar input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
#viewer{display:flex;flex-wrap:wrap;gap:30px 22px;justify-content:center;padding:26px 18px 80px}

/* 대시보드 · 설정 */
.wrapw{max-width:1100px;margin:0 auto;padding:22px 26px 100px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{font-size:12px;color:var(--muted);font-weight:700}
.card .v{font-size:24px;font-weight:800;margin-top:4px}
.card .v small{font-size:13px;color:var(--muted);font-weight:600}
.pbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eef0f2;margin-top:8px}
.pbar i{display:block;height:100%}
table.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.grid th{background:#f6f7f8;text-align:left;padding:9px 10px;font-size:12px;color:#555;border-bottom:1px solid var(--line)}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.grid tr:hover td{background:#fafbfb}
table.grid select,table.grid input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12.5px;background:#fff}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.sec h4{margin:0 0 12px;font-size:15px}
.sec .g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.sec p.d{margin:-6px 0 12px;font-size:12.5px;color:var(--muted)}
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center}
#login .box{background:#fff;border-radius:16px;padding:28px 30px;width:min(380px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:10px}
#login h2{margin:0 0 6px;font-size:19px}
#measure{position:absolute;left:-30000px;top:0;visibility:hidden}
#print-root{display:none}

/* ============================================================
   2. 인쇄 문서 (A4 쪽)
   ============================================================ */
.page{--part:var(--theme);width:210mm;height:297mm;position:relative;background:#fff;overflow:hidden;transform-origin:0 0;
  font-family:var(--docfont);color:#222;font-size:var(--fs);line-height:var(--lh);letter-spacing:-.01em;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pbody{position:absolute;top:var(--mt);bottom:var(--mb);left:var(--ml);right:var(--mr);overflow:hidden}
.page.odd .pbody{left:calc(var(--ml) + var(--gutter))}
.page.even .pbody{right:calc(var(--mr) + var(--gutter))}
.page.tocp .pbody{top:calc(var(--mt) + 13mm)}
.phead{position:absolute;top:9mm;left:var(--ml);right:var(--mr);height:9mm;display:flex;justify-content:flex-end;align-items:center;gap:2mm}
.page.even .phead{justify-content:flex-start}
.phead img{max-height:9mm;max-width:55mm;object-fit:contain}
.phead .wm{font-weight:800;color:var(--part);font-size:9.5pt;letter-spacing:-.02em}
.phead .wm small{color:#888;font-weight:600;margin-left:1.5mm}
.pfoot{position:absolute;bottom:9mm;left:var(--ml);right:var(--mr);font-size:8pt;color:#666;display:flex;letter-spacing:0}
.page.odd .pfoot{justify-content:flex-end}
.page.odd .pbody~.phead,.page.odd .pfoot{}
.pfoot b{color:#222;font-weight:700}
.pfoot .bar{display:inline-block;width:.3mm;height:2.6mm;background:#999;margin:0 2mm;vertical-align:-.3mm}
.band{position:absolute;top:var(--mt);left:var(--ml);right:var(--mr);height:9mm;background:var(--theme);color:#fff;text-align:center;font-weight:800;line-height:9mm;letter-spacing:1.4em;text-indent:1.4em;font-size:12pt}

.b{position:relative;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pbody>.b:first-child{margin-top:0!important}
.b-title{font-size:calc(var(--fs)*1.9);font-weight:800;text-align:center;margin:6mm 0 9mm;letter-spacing:.2em}
.b-h1{font-size:calc(var(--fs)*1.42);font-weight:800;margin-top:calc(8mm*var(--sp));margin-bottom:calc(3mm*var(--sp));color:#111;padding-bottom:1.3mm;border-bottom:.45mm solid var(--part);line-height:1.35}
.b-h1 .num{color:var(--part)}
.b-h2{font-size:calc(var(--fs)*1.17);font-weight:700;margin-top:calc(5.5mm*var(--sp));margin-bottom:calc(1.8mm*var(--sp));line-height:1.4}
.b-sq{font-weight:700;margin-top:calc(3.6mm*var(--sp));margin-bottom:calc(.8mm*var(--sp));padding-left:5.2mm}
.b-sq .mk{position:absolute;left:0}
.b-ci{padding-left:9.6mm;margin-top:calc(1.1mm*var(--sp))}

    if (rest.trim().length < cpl * 0.9 && lines >= 3) { n = brk(Math.floor(n - cpl)); ok(n); }
    tx.textContent = full.slice(0, n).replace(/\s+$/, '');
    if (u.t === 'p' || u.t === 'box') el.classList.add('splitfirst');
    this.newPage(ctx);

  }
  placeTable(u, ctx) {
    const m = tableModel(u.b); const len = m.rows.length; let start = m.head, cont = false;
    if (start >= len) { const el = tableEl(m, start, len, false); this.cur.body.appendChild(el); if (!this.fits(el) && !this.empty()) { el.remove(); this.newPage(ctx); this.cur.body.appendChild(el); } return; }
    let guard = 0;
    while (start < len && guard++ < 500) {
      const tryEnd = e => { const el = tableEl(m, start, e, cont); this.cur.body.appendChild(el); const r = this.fits(el); el.remove(); return r; };
      let best = start;
      if (tryEnd(len)) best = len; else { let lo = start + 1, hi = len - 1; while (lo <= hi) { const mid = (lo + hi) >> 1; if (tryEnd(mid)) { best = mid; lo = mid + 1; } else hi = mid - 1; } }
      const hadContent = !this.empty();
      if (best === start || (best - start < 2 && best < len && hadContent && len - start > 2)) { if (hadContent) { this.newPage(ctx); continue; } best = Math.max(best, start + 1); }
      if (best < len && len - best === 1 && best - start >= 3) best--; // 마지막 한 행만 다음 쪽에 남지 않게
      const el = tableEl(m, start, best, cont); this.cur.body.appendChild(el);
      if (!this.fits(el)) { el.classList.add('oversize'); this.issue(u, 'oversize', '표의 한 행이 한 쪽보다 깁니다'); }
      if (el.querySelector('table').offsetWidth > this.cur.body.clientWidth + 2) { el.classList.add('wide'); this.issue(u, 'wide', '표가 쪽 너비보다 넓습니다 (열 수·내용 조정 필요)'); }
      start = best; cont = true; if (start < len) this.newPage(ctx);
    }
  }
}

function fieldsOf(b) {
  const F = []; const add = (g, s, label) => F.push({ get: g, set: s, label });
  if (TEXT_T.has(b.t)) add(() => b.text, v => b.text = v, '본문');
  if (b.t === 'kv') { add(() => b.k, v => b.k = v, '항목'); add(() => b.v, v => b.v = v, '내용'); }
  if (b.caption != null) add(() => b.caption, v => b.caption = v, '제목');
  if (b.t === 'tbl') b.rows.forEach((r, i) => r.forEach((c, j) => add(() => b.rows[i][j], v => b.rows[i][j] = v, `표 ${i + 1}행 ${j + 1}열`)));
  if (b.t === 'bud') b.rows.forEach(r => ['cat', 'item', 'note'].forEach(k => add(() => r[k], v => r[k] = v, '예결산')));
  if (b.t === 'img') b.items.forEach(it => add(() => it.cap || '', v => it.cap = v, '사진 설명'));
  if (b.t === 'chart' && b.labels) b.labels.forEach((l, i) => add(() => b.labels[i], v => b.labels[i] = v, '차트 항목'));
  return F;
}
function terms() { return String(S().terms || '').split('\n').map(l => l.split('=>').map(s => s.trim())).filter(x => x.length === 2 && x[0] && x[0] !== x[1]); }
function runChecks(projects) {

    if (p.part !== 'front') { if (!p.meta?.start) out.push({ pid: p.id, msg: '사업 기간(시작일)이 비어 있습니다', where: p.title, lv: 'info' }); if (!p.meta?.place && p.part !== 'front') out.push({ pid: p.id, msg: '장소가 비어 있습니다', where: p.title, lv: 'info' }); }
    for (const b of p.blocks) {
      if ((b.t === 'h1' || b.t === 'h2') && !b.text?.trim()) out.push({ pid: p.id, bid: b.id, msg: '제목이 빈 단원이 있습니다', where: p.title, lv: 'warn' });
      if (b.t === 'kv' && b.k && !b.v?.trim()) out.push({ pid: p.id, bid: b.id, msg: `'${b.k}' 내용이 비어 있습니다`, where: p.title, lv: 'info' });
      if (b.t === 'img') b.items.forEach((it, i) => { if (!it.cap) out.push({ pid: p.id, bid: b.id, msg: `사진 ${i + 1}에 설명(그림 제목)이 없습니다`, where: where(b), lv: 'info' }); });
      if (b.t === 'img' && !b.items.length) out.push({ pid: p.id, bid: b.id, msg: '사진 블록이 비어 있습니다 (인쇄 시 생략)', where: p.title, lv: 'info' });
      for (const f of fieldsOf(b)) {
        const v = String(f.get() ?? ''); if (!v) continue;
        const push = (msg, fixFn, lv = 'warn') => out.push({ pid: p.id, bid: b.id, msg, where: where(b) + ' · ' + f.label, lv, fix: fixFn ? () => f.set(fixFn(String(f.get()))) : null });
        if (/[^\S\n]{2,}/.test(v.trim())) push('띄어쓰기가 두 칸 이상입니다', s => s.replace(/([^\s])[^\S\n]{2,}(?=\S)/g, '$1 '));
        if (/\S\s+[,.)」』]/.test(v)) push('문장부호 앞에 빈칸이 있습니다', s => s.replace(/(\S)\s+([,.)」』])/g, '$1$2'));
        if (/원기\d/.test(v)) push("'원기' 뒤에 띄어쓰기가 필요합니다", s => s.replace(/원기(\d)/g, '원기 $1'));

}

function pickOne(cb) { pickFiles(fs => fs[0] && cb(fs[0])); }
async function topAction(act, el) {
  const p = curP();
  switch (act) {
    case 'find': return openFind();
    case 'check': return openChecks();
    case 'date': return openDateTool();
    case 'print': return openPrint();
    case 'rebuild': return renderViewer();
    case 'recount': await buildAll(); return renderDash();
    case 'issues': { const is = LAST_BUILD?.issues || []; modal('넘침·너비 문제', `<div class="res" id="isres">${is.map((x, i) => `<div class="r lv-err" data-i="${i}">${esc(x.msg)}<small>${x.page}쪽 · ${esc(getP(x.pid)?.title || '')}</small></div>`).join('')}</div>`); $('#isres').onclick = e => { const r = e.target.closest('[data-i]'); if (r) { const x = is[+r.dataset.i]; closeModal(); gotoBlock(x.pid, x.bid); } }; return; }
    case 'sample': if (DOC.projects.length > 1 && !confirm('현재 내용을 지우고 예시 데이터로 바꿀까요?')) return;
      if (SB.on) { const d = sampleDoc(); const hasF = !!frontP(); d.projects = d.projects.filter(x => !(hasF && x.part === 'front')); for (const x of d.projects) { const { error } = await SB.client.from('rr_projects').insert(toRow(x)); if (error) return toast(error.message); } DOC.projects.push(...d.projects); }
      else DOC = sampleDoc();
      CUR = DOC.projects.find(x => x.part === 'student')?.id; saveLocal(); applyVars(); renderAll(); return;
    case 'wipe': if (!confirm('모든 사업 보고서를 지우고 빈 보고서로 시작할까요? (설정은 유지)')) return; DOC = emptyDoc(true); CUR = frontP().id; saveLocal(); renderAll(); return;
    case 'export': { const blob = new Blob([JSON.stringify(DOC, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '결과보고서_백업_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); return; }
    case 'import': { const f = document.createElement('input'); f.type = 'file'; f.accept = '.json'; f.onchange = async () => { try { const d = JSON.parse(await f.files[0].text()); if (!d.projects) throw new Error('형식이 다릅니다');
        if (!confirm(`사업 ${d.projects.length}건을 불러옵니다. ${SB.on ? '같은 ID의 사업은 덮어씁니다.' : '현재 내용은 바뀝니다.'} 계속할까요?`)) return;
        if (SB.on) { for (const x of d.projects) await SB.client.from('rr_projects').upsert(toRow(x)); DOC.settings = { ...DEFAULT_SETTINGS(), ...d.settings }; DOC.parts = d.parts || DOC.parts; markSettings(); await sbLoad(); }
        else { d.settings = { ...DEFAULT_SETTINGS(), ...d.settings }; d.comments ||= []; d.versions ||= []; DOC = d; saveLocal(); }
        CUR = DOC.projects[0]?.id; applyVars(); renderAll(); toast('불러왔습니다'); } catch (e) { toast('불러오기 실패: ' + e.message); } }; f.click(); return; }
    case 'upload-local': { const d = loadLocal(); if (!d) return toast('이 브라우저에 로컬 데이터가 없습니다'); if (!confirm(`로컬 데이터의 사업 ${d.projects.length}건을 Supabase로 올릴까요?`)) return;
      for (const x of d.projects) { const { error } = await SB.client.from('rr_projects').upsert(toRow(x)); if (error) return toast(error.message); } if (canAdmin()) { DOC.settings = d.settings; DOC.parts = d.parts; markSettings(); } await sbLoad(); renderAll(); toast('올렸습니다'); return; }
    case 'sb-save': { const url = $('#sbUrl').value.trim().replace(/\/$/, ''), key = $('#sbKey').value.trim(); if (!url || !key) return toast('URL과 키를 모두 입력하세요'); lsSet('rr-sb', JSON.stringify({ url, key })); location.reload(); return; }
    case 'sb-clear': lsSet('rr-sb', ''); location.reload(); return;
    case 'myname': { const n = $('#myName').value.trim(); if (!n) return; const { error } = await SB.client.from('rr_members').update({ name: n }).eq('user_id', SB.user.id); if (error) return toast(error.message); SB.member.name = n; renderTop(); toast('저장했습니다'); return; }
    case 'cover': case 'glogo': return pickOne(async f => { const r = await uploadImage(f, 'settings'); S()[act === 'cover' ? 'coverImage' : 'logo'] = r.src; markSettings(); renderSettings(); });
    case 'cover-x': S().coverImage = ''; markSettings(); return renderSettings();
    case 'glogo-x': S().logo = ''; markSettings(); return renderSettings();
    case 'logo': return pickOne(async f => { const r = await uploadImage(f, p.id); p.logo = r.src; markDirty(p); renderEditor(); });
    case 'logo-x': p.logo = ''; markDirty(p); return renderEditor();
    case 'tpl': { const k = $('#tplSel').value; const has = p.blocks.some(b => (b.text || b.v || b.rows?.flat().join('') || '').trim());
      let mode = 'append'; if (has) { const r = prompt('이미 내용이 있습니다.\n1 = 뒤에 이어 붙이기\n2 = 모두 지우고 바꾸기', '1'); if (r == null) return; mode = r.trim() === '2' ? 'replace' : 'append'; }
      pushUndo(p); const nb = TEMPLATES[k].make(p); p.blocks = mode === 'replace' || !has ? nb : [...p.blocks, ...nb]; renderEditor(); markDirty(p, true); toast(TEMPLATES[k].name + ' 단원을 넣었습니다'); return; }
    case 'dup': { const c = clone(p); c.id = uid(); c.title += ' (복사본)'; c.blocks.forEach(b => b.id = uid()); c.status = '작성 중'; c.sort = p.sort + 0.5; delete c.locked_by; delete c.locked_at; delete c.locked_name;
      if (SB.on) { const { error } = await SB.client.from('rr_projects').insert(toRow(c)); if (error) return toast(error.message); }
      DOC.projects.push(c); resort(p.part); selectProject(c.id); markDirty(c, true); return; }
    case 'del': if (!confirm(`'${p.title}' 보고서를 삭제할까요? 되돌릴 수 없습니다.`)) return;
      if (SB.on) { const { error } = await SB.client.from('rr_projects').delete().eq('id', p.id); if (error) return toast(error.message); }
      DOC.projects = DOC.projects.filter(x => x.id !== p.id); CUR = null; if (!SB.on) saveLocal(); renderAll(); return;
    case 'ver-save': return saveVersion(p, prompt('버전 이름', new Date().toLocaleString('ko-KR') + ' 저장') || undefined);
    case 'add-end': { const last = p.blocks.at(-1); openPalette(el, last?.id || null, 'after'); return; }
    case 'undo': return undo();
    case 'relock': await ensureLock(true); return;
  }
}
function resort(code) { projectsOf(code).forEach((x, i) => { if (x.sort !== i) { x.sort = i; dirty.add(x.id); } }); scheduleSave(); }
function addProject(code) {
  const tplOpts = Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
  modal('새 사업 보고서', `<label class="fld">사업명<input class="in" id="npT" placeholder="예) 청소년 희망캠프"></label>
   <div class="row"><label class="fld" style="flex:1">파트<select id="npP">${DOC.parts.map(x => `<option value="${x.code}" ${x.code === code ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
   <label class="fld" style="flex:1">템플릿<select id="npTpl">${tplOpts}</select></label></div>
   <div class="row"><label class="fld" style="flex:1">시작일<input type="date" id="npS"></label><label class="fld" style="flex:1">종료일<input type="date" id="npE"></label></div>
   <label class="fld">장소<input class="in" id="npPl"></label><div class="hint">템플릿에 따라 행사개요·일정표·업무분장·평가·예결산 등 단원이 미리 채워집니다.</div>`,
   `<button class="tb" data-m="close">취소</button><button class="tb pri" id="npGo">만들기</button>`);
  setTimeout(() => $('#npT').focus(), 30);
  $('#npGo').addEventListener('click', async () => { const title = $('#npT').value.trim() || '새 사업'; const part = $('#npP').value;
    const p = mkProject(part, title, $('#npTpl').value, { start: $('#npS').value, end: $('#npE').value, place: $('#npPl').value }, { status: '작성 중', owner: myName() === '나' ? '' : myName() });
    p.sort = projectsOf(part).length;
    if (SB.on) { const { error } = await SB.client.from('rr_projects').insert(toRow(p)); if (error) return toast('만들기 실패: ' + error.message); }
    DOC.projects.push(p); closeModal(); selectProject(p.id); if (!SB.on) saveLocal(); });
}

function setView(v) {
  VIEW = v; $$('#viewTabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('#main').classList.toggle('with-side', v === 'edit'); $('#side').classList.toggle('hidden', v !== 'edit');

}
function renderView() {
  if (VIEW === 'edit') { renderEditor(); renderSide(); }

  else if (VIEW === 'dash') renderDash();
  else renderSettings();
}
function renderTop() { $('#userChip').textContent = SB.on ? `${myName()} · ${{ admin: '관리자', editor: '작성자', viewer: '열람' }[role()]}` : '로컬 모드'; }
function renderAll() { applyVars(); renderTop(); renderTree(); renderView(); }
async function selectProject(id) {
  if (CUR && CUR !== id) { await flushSave(); releaseLock(CUR); }
  CUR = id; renderTree(); if (VIEW !== 'edit') setView('edit'); else { renderEditor(); renderSide(); }
  $('#center').scrollTop = 0; updatePresence();
}

/* 전역 이벤트 */
function bindGlobal() {
  $('#viewTabs').addEventListener('click', e => { const v = e.target.dataset.view; if (v) setView(v); });
  $('#top').addEventListener('click', e => { const a = e.target.closest('[data-act]')?.dataset.act; if (a) topAction(a, e.target); if (e.target.id === 'userChip' && SB.on && confirm('로그아웃할까요?')) { releaseLock(CUR); SB.client.auth.signOut().then(() => location.reload()); } });
  $('#tree').addEventListener('click', e => {
    const add = e.target.closest('[data-add]'); if (add) { e.stopPropagation(); return addProject(add.dataset.add); }
    const g = e.target.closest('[data-goto]'); if (g) return setView(g.dataset.goto);
    const it = e.target.closest('[data-pid]'); if (it) selectProject(it.dataset.pid);
  });
  // 트리 끌어서 순서 바꾸기
  let dragId = null;
  $('#tree').addEventListener('dragstart', e => { const it = e.target.closest('.ti[data-pid]'); if (!it) return; dragId = it.dataset.pid; e.dataTransfer.effectAllowed = 'move'; });
  $('#tree').addEventListener('dragover', e => { if (!dragId) return; const it = e.target.closest('.ti[data-pid],.tg-h[data-part]'); $$('.drop-before,.drop').forEach(x => x.classList.remove('drop-before', 'drop')); if (!it) return; e.preventDefault(); it.classList.add(it.classList.contains('ti') ? 'drop-before' : 'drop'); });
  $('#tree').addEventListener('drop', e => { if (!dragId) return; e.preventDefault(); const p = getP(dragId); dragId = null; $$('.drop-before,.drop').forEach(x => x.classList.remove('drop-before', 'drop'));
    const it = e.target.closest('.ti[data-pid],.tg-h[data-part]'); if (!it || !p) return; const old = p.part;
    let part, before = null; if (it.classList.contains('ti')) { const t = getP(it.dataset.pid); if (!t || t.part === 'front') return; part = t.part; before = t; } else part = it.dataset.part;
    p.part = part; const list = projectsOf(part).filter(x => x !== p); const i = before ? list.indexOf(before) : list.length; list.splice(i, 0, p);
    list.forEach((x, k) => { x.sort = k; dirty.add(x.id); }); if (old !== part) resort(old); dirty.add(p.id); scheduleSave(); renderTree(); if (CUR === p.id && VIEW === 'edit') renderEditor(); });
  $('#side').addEventListener('click', e => {
    const s = e.target.closest('[data-side]'); if (s) { SIDE = s.dataset.side; renderSide(); return; }
    const pv = e.target.dataset.pv; const p = curP();
    if (pv === 'c+' || pv === 'c-') { p.compact = Math.max(0, Math.min(3, (p.compact || 0) + (pv === 'c+' ? 1 : -1))); markDirty(p); renderPreviewPane(); return; }
    if (pv === 'fit') return fitOneLess(p);
    const cm = e.target.closest('[data-cm]'); if (cm) return commentAction(cm.dataset.cm, cm);
    const vr = e.target.closest('[data-vr]'); if (vr) return versionAction(vr.dataset.vr, vr);
    const ck = e.target.closest('[data-ck]');
    if (ck?.dataset.ck === 'fixall') { pushUndo(p); runChecks([p]).filter(x => x.fix).forEach(x => x.fix()); markDirty(p, true); renderEditor(); renderIssuesPane(); toast('고쳤습니다'); return; }
    if (ck?.dataset.ck === 'go' && ck.dataset.bid) return gotoBlock(p.id, ck.dataset.bid);
    const blk = e.target.closest('.page [data-bid]'); if (blk) gotoBlock(p.id, blk.dataset.bid);
  });
  $('#side').addEventListener('input', e => { if (e.target.dataset.pv === 'zoom') { pvScale = +e.target.value; renderPreviewPane(); } });
  $('#center').addEventListener('input', e => { if (e.target.id === 'vwZoom') { vwScale = +e.target.value; showViewer(LAST_BUILD); } });
  $('#center').addEventListener('change', async e => {
    if (e.target.id === 'vwRange') { vwRange = e.target.value; if (vwRange === 'pages') { const r = prompt('본문 쪽 범위 (예: 5-20)', '1-10'); const m = r?.match(/(\d+)\s*-\s*(\d+)/); window._pgRange = m ? [+m[1], +m[2]] : [1, 9999]; } showViewer(LAST_BUILD); }
    const dp = e.target.dataset.dp; if (dp) { const p = getP(e.target.closest('tr').dataset.pid); p[dp] = e.target.value; markDirty(p); renderTree(); }
    if (e.target.dataset.s != null) { const k = e.target.dataset.s; const t = e.target; S()[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value; if (k === 'tocDepth') S()[k] = +t.value; applyVars(); markSettings(); if (['projectDivider', 'showSummary'].includes(k)) renderTree(); }
    if (e.target.dataset.pt != null) { DOC.parts[+e.target.dataset.pt].name = e.target.value; markSettings(); renderTree(); }
    if (e.target.dataset.ptc != null) { DOC.parts[+e.target.dataset.ptc].color = e.target.value; markSettings(); renderTree(); }
    if (e.target.dataset.mm) { const uidv = e.target.closest('tr').dataset.uid; const { error } = await SB.client.from('rr_members').update({ [e.target.dataset.mm]: e.target.value }).eq('user_id', uidv); toast(error ? error.message : '권한을 바꿨습니다'); }
  });
  $('#center').addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); selectProject(o.dataset.open); } const a = e.target.closest('#viewerBar [data-act], .wrapw [data-act]'); if (a && VIEW !== 'edit') topAction(a.dataset.act, a); const pg = e.target.closest('#viewer .page [data-bid]'); if (pg) { const w = e.target.closest('.page'); const pid = LAST_BUILD?.pages.find(x => x.el === w)?.ctx.pid; if (pid && getP(pid)) gotoBlock(pid, pg.dataset.bid); } });
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'p') { e.preventDefault(); openPrint(); }
    if ((e.ctrlKey || e.metaKey) && k === 'f') { e.preventDefault(); openFind(); }
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); flushSave(); }
    if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey && VIEW === 'edit' && !(document.activeElement?.isContentEditable || /INPUT|TEXTAREA/.test(document.activeElement?.tagName))) { e.preventDefault(); undo(); }
    if (e.key === 'Escape') { closePop(); closeModal(); }
  });
  window.addEventListener('beforeunload', e => { if (dirty.size || SB.settingsDirty) { flushSave(); e.preventDefault(); e.returnValue = ''; } releaseLock(CUR); });
}

/* ---------------------------------------------------------------------
   Supabase: 로그인 · 불러오기 · 실시간 · 잠금
   --------------------------------------------------------------------- */
function sbConfig() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  try { const c = JSON.parse(lsGet('rr-sb') || 'null'); if (c?.url && c?.key) return c; } catch {} return null;
}
async function sbInit() {
  const c = sbConfig(); if (!c) return false;
  if (!(await waitFor(() => window.supabase, 5000))) {   // 1차 CDN 실패 시 다른 CDN으로 다시 시도
    const sc = document.createElement('script'); sc.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'; document.head.appendChild(sc);
    if (!(await waitFor(() => window.supabase, 8000))) { connFail('Supabase 라이브러리를 불러오지 못했습니다. 회사·학교 네트워크에서 cdn.jsdelivr.net, unpkg.com이 막혀 있는지 확인하세요.'); return false; }
  }
  let session;
  try { SB.client = supabase.createClient(c.url.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, ''), c.key); ({ data: { session } } = await SB.client.auth.getSession()); }
  catch (e) { connFail('Supabase 연결 오류: ' + (e.message || e)); return false; }
  if (!session) { showLogin(); return 'login'; }
  SB.user = session.user; return afterLogin();
}
function connFail(msg) {
  console.error(msg); setTimeout(() => { const c = $('#center'); const b = document.createElement('div'); b.className = 'banner lock'; b.style.margin = '14px 26px 0'; b.innerHTML = '⚠ <b>공동작업 연결 실패 — 지금은 로컬 모드입니다.</b> ' + esc(msg); c.prepend(b); }, 800);
  setTimeout(() => setSave('연결 실패 · 로컬 모드', true), 900);
}
function showLogin() {
  const d = document.createElement('div'); d.id = 'login'; document.body.appendChild(d);
  const KO = m => /Invalid login credentials/i.test(m) ? '이메일 또는 비밀번호가 맞지 않습니다. 아직 계정이 없다면 아래 「회원가입」을 눌러 주세요.'
    : /already registered|already been registered/i.test(m) ? '이미 가입된 이메일입니다. 로그인 화면에서 로그인하세요.'
    : /at least|Password should/i.test(m) ? '비밀번호가 너무 짧거나 단순합니다. 6자 이상(영문·숫자 섞어서)으로 정해 주세요.'
    : /rate limit/i.test(m) ? '짧은 시간에 요청이 너무 많았습니다. 잠시 뒤 다시 시도하세요.'
    : /invalid.*email|Unable to validate email/i.test(m) ? '이메일 주소 형식을 확인하세요.' : m;
  const msg = (t, ok) => { const e = $('#lgMsg'); if (e) e.innerHTML = `<span style="color:${ok ? 'var(--accent)' : 'var(--danger)'}">${esc(t)}</span>`; };
  const enter = async user => { SB.user = user; d.remove(); history.replaceState(null, '', location.pathname + location.search); await afterLogin(); renderAll(); };
  const busy = (btn, on, label) => { btn.disabled = on; btn.textContent = on ? '처리 중…' : label; };
  const loginView = () => {
    d.innerHTML = `<div class="box"><h2>결과보고서 제작실</h2><div class="hint">청소년국 공동 작업 공간에 로그인하세요.</div>
     <input class="in" id="lgE" type="email" placeholder="이메일" autocomplete="email">
     <input class="in" id="lgP" type="password" placeholder="비밀번호" autocomplete="current-password">
     <button class="tb pri" id="lgIn">로그인</button><div class="hint" id="lgMsg"></div>
     <div class="row" style="justify-content:space-between;margin-top:4px"><span class="hint">아직 계정이 없나요?</span><button class="tb sm" id="goUp">회원가입</button></div>
     <div class="row" style="justify-content:space-between"><span class="hint">비밀번호가 기억나지 않나요?</span><button class="tb sm" id="lgMg">이메일 링크로 로그인</button></div>
     <button class="tb sm" id="lgLocal" style="margin-top:8px">로그인 없이 로컬 모드로 보기</button></div>`;
    const go = async () => { const btn = $('#lgIn'); busy(btn, true, '로그인'); const { data, error } = await SB.client.auth.signInWithPassword({ email: $('#lgE').value.trim(), password: $('#lgP').value }); busy(btn, false, '로그인'); if (error) return msg(KO(error.message)); enter(data.user); };
    $('#lgIn').onclick = go; $('#lgP').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#goUp').onclick = () => { location.hash = 'signup'; };
    $('#lgMg').onclick = async () => { const em = $('#lgE').value.trim(); if (!em) return msg('이메일을 먼저 입력하세요.'); const { error } = await SB.client.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href.split('#')[0], shouldCreateUser: false } }); msg(error ? KO(error.message) : '로그인 링크를 메일로 보냈습니다. 메일함을 확인하세요.', !error); };
    $('#lgLocal').onclick = () => { d.remove(); window.removeEventListener('hashchange', route); SB.on = false; DOC = loadLocal() || sampleDoc(); CUR = DOC.projects.find(p => p.part === 'student')?.id || DOC.projects[0]?.id; renderAll(); setSave('로컬 모드'); };
    setTimeout(() => $('#lgE')?.focus(), 30);
  };
  const signupView = () => {
    d.innerHTML = `<div class="box"><h2>회원가입</h2><div class="hint">가입하면 바로 모든 파트의 보고서를 함께 작성할 수 있습니다.</div>
     <label class="fld">이름<input class="in" id="suN" placeholder="예) 홍길동 교무" autocomplete="name"></label>
     <label class="fld">이메일<input class="in" id="suE" type="email" placeholder="you@example.com" autocomplete="email"></label>
     <label class="fld">비밀번호<input class="in" id="suP" type="password" placeholder="6자 이상" autocomplete="new-password"></label>
     <label class="fld">비밀번호 확인<input class="in" id="suP2" type="password" autocomplete="new-password"></label>
     <button class="tb pri" id="suGo">가입하기</button><div class="hint" id="lgMsg"></div>
     <div class="row" style="justify-content:space-between;margin-top:4px"><span class="hint">이미 계정이 있나요?</span><button class="tb sm" id="goIn">로그인으로 돌아가기</button></div></div>`;
    const go = async () => {
      const n = $('#suN').value.trim(), em = $('#suE').value.trim(), pw = $('#suP').value, pw2 = $('#suP2').value;
      if (!n) return msg('이름을 입력하세요. 댓글과 편집 기록에 표시됩니다.');
      if (!/^\S+@\S+\.\S+$/.test(em)) return msg('이메일 주소를 확인하세요.');
      if (pw.length < 6) return msg('비밀번호는 6자 이상이어야 합니다.');
      if (pw !== pw2) return msg('비밀번호 확인이 일치하지 않습니다.');
      const btn = $('#suGo'); busy(btn, true, '가입하기');
      const { data, error } = await SB.client.auth.signUp({ email: em, password: pw, options: { data: { name: n }, emailRedirectTo: location.href.split('#')[0] } });
      busy(btn, false, '가입하기');
      if (error) return msg(KO(error.message));
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return msg('이미 가입된 이메일입니다. 로그인 화면에서 로그인하세요.');
      if (data.session) enter(data.user);
      else { d.querySelector('.box').innerHTML = `<h2>메일을 확인해 주세요</h2><div class="hint" style="font-size:13px;line-height:1.7"><b>${esc(em)}</b>로 확인 메일을 보냈습니다.<br>메일의 링크를 누른 뒤 로그인하세요.</div><button class="tb pri" id="goIn">로그인 화면으로</button>`; $('#goIn').onclick = () => { location.hash = ''; }; return; }
    };
    $('#suGo').onclick = go; $('#suP2').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#goIn').onclick = () => { location.hash = ''; };
    setTimeout(() => $('#suN')?.focus(), 30);
  };
  const route = () => { if (!document.body.contains(d)) return; location.hash === '#signup' ? signupView() : loginView(); };
  window.addEventListener('hashchange', route); route();
}
async function afterLogin() {
  const nm = SB.user.user_metadata?.name || '';
  const { data, error } = await SB.client.rpc('rr_join', { nm }); if (error) { connFail('구성원 등록 실패: ' + error.message + ' — Supabase SQL Editor에서 schema.sql을 실행했는지 확인하세요.'); return false; }
  SB.member = Array.isArray(data) ? data[0] : data; SB.on = true;
  await sbLoad(); sbRealtime(); setInterval(heartbeat, 40000); setSave('연결됨');
  if (SB.member.role === 'viewer') toast('현재 ‘열람’ 권한입니다. 편집하려면 관리자에게 작성자 권한을 요청하세요.', 6000);
  return true;
}
async function sbLoad() {
  const c = SB.client;
  const { data: st } = await c.from('rr_settings').select('*').eq('id', 1).maybeSingle();
  DOC = DOC || { settings: DEFAULT_SETTINGS(), parts: DEFAULT_PARTS(), projects: [], comments: [], versions: [] };
  if (st?.data?.settings) { DOC.settings = { ...DEFAULT_SETTINGS(), ...st.data.settings }; DOC.parts = st.data.parts || DEFAULT_PARTS(); }
  else if (canAdmin()) { await c.from('rr_settings').upsert({ id: 1, data: { settings: DOC.settings, parts: DOC.parts } }); }
  const { data: rows, error } = await c.from('rr_projects').select('*').order('sort'); if (error) { connFail('보고서를 불러오지 못했습니다: ' + error.message + (/permission denied/.test(error.message) ? ' — SQL Editor에서 supabase/fix-grants.sql을 실행하세요.' : '')); return; }
  DOC.projects = rows.map(fromRow);
  if (!frontP() && canAdmin()) { const f = emptyDoc(true).projects[0]; await c.from('rr_projects').insert(toRow(f)); DOC.projects.push(f); }
  if (!CUR || !getP(CUR)) CUR = DOC.projects.find(p => p.part !== 'front')?.id || frontP()?.id || null;
}
function sbRealtime() {
  const c = SB.client;
  c.channel('rr-db')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_projects' }, onProjChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_settings' }, pl => { if (SB.settingsDirty || !pl.new?.data?.settings) return; DOC.settings = { ...DEFAULT_SETTINGS(), ...pl.new.data.settings }; DOC.parts = pl.new.data.parts || DOC.parts; applyVars(); renderTree(); if (VIEW === 'settings' && pl.new.updated_by !== myName()) renderSettings(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_comments' }, pl => { if (VIEW === 'edit' && SIDE === 'comments' && (pl.new?.project_id || pl.old?.project_id) === CUR) renderComments(); })
    .subscribe();
  const pr = c.channel('rr-presence', { config: { presence: { key: SB.user.id } } });
  pr.on('presence', { event: 'sync' }, () => { const st = pr.presenceState(); const m = {}; Object.values(st).flat().forEach(x => { if (x.pid) (m[x.pid] ||= []).push(x.name); }); SB.presence = m; renderTreeSoon(); });
  pr.subscribe(s => { if (s === 'SUBSCRIBED') { SB.pres = pr; updatePresence(); } });
}
function updatePresence() { if (SB.pres) SB.pres.track({ name: myName(), pid: CUR }); }
function onProjChange(pl) {
  if (pl.eventType === 'DELETE') { DOC.projects = DOC.projects.filter(p => p.id !== pl.old.id); if (CUR === pl.old.id) { CUR = null; renderView(); } renderTree(); return; }
  const r = pl.new; const local = getP(r.id); const lockF = { locked_by: r.locked_by, locked_name: r.locked_name, locked_at: r.locked_at };
  if (local && SB.locks.has(r.id)) { Object.assign(local, lockF); return; }  // 내가 편집 중: 내 내용 유지
  const np = fromRow(r);
  if (local) Object.assign(local, np); else DOC.projects.push(np);
  renderTreeSoon();
  if (r.id === CUR && VIEW === 'edit') { const ae = document.activeElement; if (!$('#center').contains(ae)) { renderEditor(); schedulePreview(); } else if (lockedByOther(np)) { renderEditor(); } }
}
async function ensureLock(force) {
  const p = curP(); if (!SB.on || !p || !canEdit(p)) return; SB.lastAct = Date.now();
  if (SB.locks.has(p.id) && !force) return;
  const { data, error } = await SB.client.rpc('rr_lock', { pid: p.id, nm: myName() }); if (error) { toast('잠금 실패: ' + error.message); return; }
  const row = data.row; const fresh = fromRow(row);
  if (data.ok) {
    SB.locks.add(p.id);
    if (row.updated_at && p.updated_at && Date.parse(row.updated_at) > Date.parse(p.updated_at) && !dirty.has(p.id)) { Object.assign(p, fresh); renderEditor(); toast('다른 사람이 바꾼 최신 내용을 불러왔습니다'); }
    Object.assign(p, { locked_by: row.locked_by, locked_name: row.locked_name, locked_at: row.locked_at });
    if (force) renderEditor();
  } else { Object.assign(p, fresh); renderEditor(); renderTree(); toast(`${data.locked_name}님이 편집 중이라 읽기 전용입니다`); }
}
async function heartbeat() {
  for (const id of [...SB.locks]) { if (Date.now() - SB.lastAct > 180000 || id !== CUR) { await flushSave(); releaseLock(id); } else await SB.client.rpc('rr_lock', { pid: id, nm: myName() }); }
}
function releaseLock(id) { if (!SB.on || !id || !SB.locks.has(id)) return; SB.locks.delete(id); SB.client.rpc('rr_unlock', { pid: id }).then(() => {}); const p = getP(id); if (p) p.locked_by = null; }

/* ---------------------------------------------------------------------
   시작
   --------------------------------------------------------------------- */
(async function start() {
  bindGlobal(); bindEditor();
  const r = await sbInit();
  if (r === 'login') { DOC = { settings: DEFAULT_SETTINGS(), parts: DEFAULT_PARTS(), projects: [], comments: [], versions: [] }; return; }
  if (!r) { DOC = loadLocal() || sampleDoc(); CUR = DOC.projects.find(p => p.part === 'student')?.id || DOC.projects[0]?.id; setSave('로컬 모드 · 이 브라우저에 저장'); }
  renderAll();
  await document.fonts.ready.catch(() => {});
  setTimeout(async () => { await buildAll(); if (VIEW === 'edit') renderPreviewPane(); }, 300);
})();
